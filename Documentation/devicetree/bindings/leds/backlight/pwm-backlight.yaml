%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/backlight/pwm-backlight.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: pwm-backlight

maintainers:
  - Lee Jones <lee@kernel.org>
  - Daniel Thompson <daniel.thompson@linaro.org>
  - Jingoo Han <jingoohan1@gmail.com>

allOf:
  - $ref: common.yaml#

properties:
  compatible:
    const: pwm-backlight

  pwms:
    maxItems: 1

  pwm-names: true

  power-supply:
    description: regulator for supply voltage

  enable-gpios:
    description:
      Contains a single GPIO specifier for the GPIO which enables and disables
      the backlight.
    maxItems: 1

  post-pwm-on-delay-ms:
    description:
      Delay in ms between setting an initial (non-zero) PWM and enabling the
      backlight using GPIO.

  pwm-off-delay-ms:
    description:
      Delay in ms between disabling the backlight using GPIO and setting PWM
      value to 0.

  num-interpolated-steps:
    description:
      Number of interpolated steps between each value of brightness-levels
      table. This way a high resolution pwm duty cycle can be used without
      having to list out every possible value in the brightness-level array.
    $ref: /schemas/types.yaml#/definitions/uint32

  pwm-enable-guard-period-us:
    description: >
      Duration in microseconds for which the PWM is set to a full duty
      cycle (duty_cycle == period) before the requested brightness level
      is applied, whenever this follows a period where the output was
      disabled or held at a constant inactive level (power-up, resume,
      transition from brightness 0).

      Needed by LED drivers whose PWM dimming input switches into a
      different control mode when held continuously high beyond a
      device-specific time. Example: TI TPS61160/TPS61161 enter one-wire
      (EasyScale) command mode if CTRL stays high for >= 2.5 ms and need
      a 100% duty cycle interval at startup for sensitivity calibration.
      Use a value greater than the maximum detection window from the
      datasheet (TPS61160/61: minimum recommended value 2500).

      The guard is issued when the backlight transitions from off to on.
      The PWM provider must support a full-duty request and the board
      must ensure that the dimming input is in a defined inactive state
      while the backlight is off.
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 0

dependencies:
  default-brightness-level: [brightness-levels]
  num-interpolated-steps: [brightness-levels]

required:
  - compatible
  - pwms

unevaluatedProperties: false

examples:
  - |
    backlight {
        compatible = "pwm-backlight";
        pwms = <&pwm 0 5000000>;

        brightness-levels = <0 4 8 16 32 64 128 255>;
        default-brightness-level = <6>;

        power-supply = <&vdd_bl_reg>;
        enable-gpios = <&gpio 58 0>;
        post-pwm-on-delay-ms = <10>;
        pwm-off-delay-ms = <10>;
    };

  - |
    // Example using num-interpolation-steps:
    backlight {
        compatible = "pwm-backlight";
        pwms = <&pwm 0 5000000>;

        brightness-levels = <0 2048 4096 8192 16384 65535>;
        num-interpolated-steps = <2048>;
        default-brightness-level = <4096>;

        power-supply = <&vdd_bl_reg>;
        enable-gpios = <&gpio 58 0>;
    };

...
