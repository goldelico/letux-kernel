%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/ingenic,x1600-adc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic X1600 ADC

maintainers:
  - Olivier Louvignes <olivier@mgcrea.io>

description:
  The SAR ADC of the Ingenic X1600 SoC, with four auxiliary input channels
  measured against a 3.3 V reference.

properties:
  compatible:
    const: ingenic,x1600-adc

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

  '#io-channel-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - interrupts
  - '#io-channel-cells'

additionalProperties: false

examples:
  - |
    adc@10070000 {
        compatible = "ingenic,x1600-adc";
        reg = <0x10070000 0x30>;

        clocks = <&cgu 28>;

        interrupt-parent = <&intc>;
        interrupts = <11>;

        #io-channel-cells = <1>;
    };
