%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/ingenic,sfc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic SoCs SPI flash controller

maintainers:
  - Olivier Louvignes <olivier@mgcrea.io>

allOf:
  - $ref: /schemas/spi/spi-controller.yaml#

properties:
  compatible:
    enum:
      - ingenic,x1600-sfc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,x1600-cgu.h>

    spi@13440000 {
        compatible = "ingenic,x1600-sfc";
        reg = <0x13440000 0x10000>;
        interrupts = <7>;
        clocks = <&cgu X1600_CLK_SFC>;
        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
            compatible = "spi-nand";
            reg = <0>;
            spi-max-frequency = <24000000>;
        };
    };
